---
on:
  workflow_call:
permissions:
  contents: read
env:
  PHP_VERSION: '8.5'
jobs:
  lint:
    name: 'Lint'
    runs-on: ubuntu-latest
    steps:
      - name: 'Check out code'
        uses: actions/checkout@v7

      - name: 'Set up PHP'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: 'Install dependencies'
        uses: ramsey/composer-install@v4
        with:
          working-directory: 'app/'
          require-lock-file: true

      - name: 'Run PHP-CS-Fixer'
        run: composer lint:dry-run --working-dir=app/

  phpstan:
    name: 'PHPStan'
    runs-on: ubuntu-latest
    steps:
      - name: 'Check out code'
        uses: actions/checkout@v7

      - name: 'Set up PHP'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: 'Install dependencies'
        uses: ramsey/composer-install@v4
        with:
          working-directory: 'app/'
          require-lock-file: true

      - name: 'Run PHPStan'
        run: composer phpstan --working-dir=app/

  phpunit:
    name: 'PHPUnit'
    runs-on: ubuntu-latest
    steps:
      - name: 'Check out code'
        uses: actions/checkout@v7

      - name: 'Set up PHP'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: 'Install dependencies'
        uses: ramsey/composer-install@v4
        with:
          working-directory: 'app/'
          require-lock-file: true

      - name: 'Run PHPUnit'
        run: composer test --working-dir=app/

  rector:
    name: 'Rector'
    runs-on: ubuntu-latest
    steps:
      - name: 'Check out code'
        uses: actions/checkout@v7

      - name: 'Set up PHP'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: 'Install dependencies'
        uses: ramsey/composer-install@v4
        with:
          working-directory: 'app/'
          require-lock-file: true

      - name: 'Run Rector'
        run: composer rector:dry-run --working-dir=app/
